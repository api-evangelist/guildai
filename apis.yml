aid: guildai
name: Guild.ai
description: >-
  Guild.ai is a control plane for AI agents that lets engineering teams build, deploy,
  govern, and share agents in production. Agents are authored in TypeScript with the
  @guildai/agents-sdk (alongside Guild Native and Goose recipe agent types) and run in a
  governed, sandboxed runtime that mediates all external tool access and enforces
  least-privilege scoped credentials, with workspaces, versioning, audit logs, and
  real-time usage and cost tracking. Guild is model-agnostic across OpenAI, Anthropic,
  and Google, ships a first-party CLI that also runs an MCP server, exposes a Guildcode
  REST API plus per-trigger API keys for programmatic invocation, offers 40+ integrations
  (GitHub, Slack, Jira, Linear, Notion, Google Cloud, and more), and provides an Agent Hub
  for discovering, forking, and publishing agents. Backed by GV, NFX, and Khosla Ventures.
